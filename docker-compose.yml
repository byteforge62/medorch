services:
  postgres:
    image: postgres:17
    container_name: medorch-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: medorch
      POSTGRES_USER: medorch
      POSTGRES_PASSWORD: medorch_dev_password

    ports:
      - "5432:5432"

    volumes:
      - medorch_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medorch -d medorch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medorch_postgres_data: